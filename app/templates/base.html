<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TO-DO List{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid d-flex">
        <a class="navbar-brand" href="{{ url_for('index') }}">TO-DO List</a>
        <div class="ms-auto d-flex gap-3">
            {% if not current_user.is_authenticated: %}
            <a class="navbar-brand" href="{{ url_for('register') }}">Register</a>
            <a class="navbar-brand" href="{{ url_for('login') }}">Login</a>

            {% elif current_user.is_authenticated: %}
            <a class="navbar-brand" href="{{ url_for('logout') }}">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

{% block content %}{% endblock %}


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
